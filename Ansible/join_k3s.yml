- name: Join cluster
  hosts: workers
  become: yes
  tasks:
    - name: Copy K3s
      ansible.builtin.copy:
        src: /home/master/marineford/Ansible/K3s
        dest: /usr/local/bin/k3s
        mode: '0755'
    - name: Install K3s
      ansible.builtin.shell: >
         curl -sfL https://get.k3s.io | 
         INSTALL_K3S_SKIP_DOWNLOAD=true 
         K3S_URL=https://192.168.10.10:6443 
         K3S_TOKEN=K1048c1986a241c55b5132cfaf6173a283847f4e063ea1557edbe647d04bf8c620b::server:d8f19ae346d9d3259fc9c0d196e963e2 
         INSTALL_K3S_EXEC="--flannel-iface enp0s8 --node-ip {{ ansible_host }}" sh -
